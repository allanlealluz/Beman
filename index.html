<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="shortcut icon" href="stoic.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/index.css">
</head>
<body>

  <!-- Fundo: duas camadas que alternam com fade + véu escuro para dar leitura ao texto -->
  <div class="fundo" aria-hidden="true">
    <div class="fundo-camada" id="fundoA"></div>
    <div class="fundo-camada" id="fundoB"></div>
    <div class="fundo-veu"></div>
  </div>
  <a class="fundo-credito" id="fundoCredito" href="https://www.wikipedia.org" target="_blank" rel="noopener"></a>

  <div class="container">
    <h1>Citações & Reflexões</h1>

    <!-- Busca por termo -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Digite um tema (ex: coragem, tempo, amor)...">
      <button onclick="buscarPorTema()">Buscar</button>
    </div>

    <div class="options">
      <button class="btn-secundary" onclick="carregarFrase('aleatorio')">Aleatória</button>
      <button class="btn-secundary" onclick="carregarFrase('biblia')">Bíblia</button>
      <button class="btn-secundary" onclick="carregarFrase('estoico')">Marco Aurélio / Estoicos</button>
      <button class="btn-secundary" onclick="carregarFrase('nietzsche')">Nietzsche</button>
    </div>

    <!-- Exibicao da Citação -->
    <div class="quote-card" id="quoteCard">
      <p class="quote-text" id="quoteText">Clique em um dos botões para gerar uma citação.</p>
      <div class="quote-author">
        <span id="quoteAuthor"></span>
        <div class="quote-source" id="quoteSource"></div>
      </div>
    </div>
  </div>

  <script src="JS/fundo.js"></script>
  <script src="JS/quoteService.js"></script>
</body>
</html>
